<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Paper-ready Bowling Route Handoff</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f4,#121513);--panel:light-dark(#fff,#1b201d);--fg:light-dark(#17201a,#edf4ee);--muted:light-dark(#68736c,#9eaba2);--border:light-dark(#d7ddd8,#354039);--accent:#1f9d68;--warn:#d88b27;--sphere:#cc6e5c;--band:#4b8fb8}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--fg);font:13px/1.42 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}.kicker{font-size:11px;letter-spacing:.13em;color:var(--accent);font-weight:700}.head h1{margin:3px 0 0;font-size:22px}.contract{max-width:480px;color:var(--muted);text-align:right}.controls{display:grid;grid-template-columns:1.35fr .55fr .8fr .65fr 1.7fr;gap:9px;padding:11px;background:var(--panel);border:1px solid var(--border);border-radius:9px}label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em}select{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg)}select:disabled{opacity:.55}.stage{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:11px;margin-top:11px}.plot{height:660px;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden}.side{display:flex;flex-direction:column;gap:10px}.card{padding:11px;background:var(--panel);border:1px solid var(--border);border-radius:9px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{padding:8px;border-bottom:2px solid var(--border)}.metric b{display:block;font-size:17px}.muted{color:var(--muted)}.routes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.route{text-align:center;padding:5px 2px;border-bottom:2px solid var(--border);color:var(--muted)}.route.on{border-color:var(--accent);color:var(--fg);font-weight:700}.placeholder{display:none;padding:30px 18px;text-align:center}.placeholder b{display:block;font-size:20px;margin-bottom:5px}.quality{margin-top:auto}.badge{display:inline-block;padding:2px 6px;border:1px solid var(--border);border-radius:999px;margin:2px 2px 0 0}.pass{color:var(--accent)}.fail{color:#d24b4b}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.stage{grid-template-columns:1fr}.plot{height:540px}.side{display:grid;grid-template-columns:1fr 1fr}.quality{margin-top:0}}@media(max-width:560px){body{padding:10px}.head{display:block}.contract{text-align:left;margin-top:5px}.controls,.side{grid-template-columns:1fr}.plot{height:470px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<div class="head"><div><div class="kicker">FIXED BOWLING 1–2–3 · FAITHFUL RAW NFE16 M1</div><h1>Paper-ready route handoff</h1></div><div class="contract" id="contract"></div></div>
<div class="controls">
  <label>View<select id="group">
    <option value="legacy-pre2">PRE2 · strict-positive raw successes</option>
    <option value="legacy-s4">S4 · strict-positive raw successes</option>
    <option value="legacy-s4-distinct">S4 · monotone distinct routes</option>
    <option value="paper-ready-pre2">paper-ready-pre2</option>
    <option value="paper-ready-less-expanded">paper-ready-less-expanded</option>
    <option value="paper-ready-expanded" selected>paper-ready-expanded</option>
    <option value="paper-ready-cfmmppi">paper-ready-cfmmppi</option>
    <option value="paper-ready-safemppi">paper-ready-safemppi</option>
    <option value="not-paper-ready-pre2">not-paper-ready-pre2</option>
    <option value="not-paper-ready-expanded">not-paper-ready-expanded</option>
    <option value="not-paper-ready-cfmmppi">not-paper-ready-cfmmppi</option>
  </select></label>
  <label>γ<select id="gamma"></select></label>
  <label>CFM regime<select id="regime"><option value="all">All regimes</option></select></label>
  <label>Route<select id="route"><option value="all">All modes</option></select></label>
  <label>Focus trajectory<select id="focus"></select></label>
</div>
<div class="stage">
  <div><div id="plot" class="plot"></div><div id="placeholder" class="card placeholder"><b>No trajectories in this filter</b><span class="muted">Choose another gamma, regime, or route.</span></div></div>
  <aside class="side"><div class="card"><div class="metric-grid" id="metrics"></div></div><div class="card" id="audit"></div><div class="card" id="coverage"></div><div class="card quality" id="quality"></div></aside>
</div>
<script>
(()=>{
const DATA=__PAPER_READY_BOWLING_DATA__,group=document.querySelector('#group'),gamma=document.querySelector('#gamma'),regime=document.querySelector('#regime'),route=document.querySelector('#route'),focus=document.querySelector('#focus'),plot=document.querySelector('#plot'),placeholder=document.querySelector('#placeholder'),metrics=document.querySelector('#metrics'),audit=document.querySelector('#audit'),coverage=document.querySelector('#coverage'),quality=document.querySelector('#quality');
document.querySelector('#contract').textContent=DATA.contract;
DATA.routes.forEach(code=>route.insertAdjacentHTML('beforeend',`<option value="${code}">${code}</option>`));
const routeColors={LLL:'#3182bd',LLR:'#6baed6',LRL:'#31a354',LRR:'#74c476',RLL:'#e6550d',RLR:'#fd8d3c',RRL:'#756bb1',RRR:'#9e9ac8'};
function decode(row){const raw=atob(row.states.b),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),v=new DataView(bytes.buffer),n=row.states.n,p=[];let o=0,x=v.getInt16(o,true),y=v.getInt16(o+2,true),z=v.getInt16(o+4,true);o+=6;p.push([x,y,z]);for(let i=1;i<n;i++){x+=v.getInt16(o,true);y+=v.getInt16(o+2,true);z+=v.getInt16(o+4,true);o+=6;p.push([x,y,z])}const speed=[];for(let i=0;i<n;i++,o+=2)speed.push(v.getUint16(o,true));return p.map((q,i)=>[q[0]/1000,q[1]/1000,q[2]/1000,speed[i]/1000])}
function isCfm(){return group.value.includes('cfmmppi')}
function label(r){const mode=r.route||r.status;const method=r.regime?`${r.model}/${r.regime}`:r.model;const seed=r.seed==null?'seed legacy':`seed ${r.seed}`;return `${method} · γ=${r.gamma} · ${mode} · trial ${r.episode+1} · ${seed}`}
function rows(){const values=DATA.groups[group.value];if(values===null)return null;return values.filter(r=>(gamma.value==='all'||Number(r.gamma)===Number(gamma.value))&&(regime.value==='all'||r.regime===regime.value)&&(route.value==='all'||r.route===route.value))}
function setGammas(){const values=DATA.groups[group.value];const gs=values===null?[]:[...new Set(values.map(r=>r.gamma))].sort((a,b)=>a-b);gamma.innerHTML=(group.value.startsWith('paper-ready-')?gs: ['all',...gs]).map(g=>`<option value="${g}">${g==='all'?'All non-promoted γ':`γ=${g}`}</option>`).join('')}
function setRegimes(){const values=DATA.groups[group.value]||[];const names=[...new Set(values.map(r=>r.regime).filter(Boolean))].sort();regime.innerHTML=['all',...names].map(name=>`<option value="${name}">${name==='all'?'All regimes':name}</option>`).join('');regime.disabled=!isCfm()}
function setFocus(values){const old=focus.value;focus.innerHTML=values.map(r=>`<option value="${r.id}">${label(r)}</option>`).join('');if(values.some(r=>r.id===old))focus.value=old}
function sphere(s,i){const[cx,cy,cz,r]=s,x=[],y=[],z=[];for(let a=0;a<=10;a++){const th=Math.PI*a/10,X=[],Y=[],Z=[];for(let b=0;b<=18;b++){const ph=2*Math.PI*b/18;X.push(cx+r*Math.sin(th)*Math.cos(ph));Y.push(cy+r*Math.sin(th)*Math.sin(ph));Z.push(cz+r*Math.cos(th))}x.push(X);y.push(Y);z.push(Z)}return{type:'surface',x,y,z,showscale:false,hoverinfo:'skip',opacity:.38,colorscale:[[0,'#cc6e5c'],[1,'#cc6e5c']],name:`sphere ${i+1}`}}
function plane(z,opacity=.035){const b=DATA.scene.bounds;return{type:'surface',x:[[b[0][0],b[0][1]],[b[0][0],b[0][1]]],y:[[b[1][0],b[1][0]],[b[1][1],b[1][1]]],z:[[z,z],[z,z]],showscale:false,hoverinfo:'skip',opacity,colorscale:[[0,'#4b8fb8'],[1,'#4b8fb8']]}}
function trace(r,focused){const p=decode(r),statusColors={COLLISION:'#d24b4b',OOB:'#8c62aa',TIMEOUT:'#737d77'},c=focused?'#e2b93b':(statusColors[r.status]||routeColors[r.route]||'#4b8fb8');return{type:'scatter3d',mode:'lines+markers',x:p.map(q=>q[0]),y:p.map(q=>q[1]),z:p.map(q=>q[2]),customdata:p.map((q,i)=>[label(r),(i*DATA.dt).toFixed(1),q[3].toFixed(3)]),showlegend:false,opacity:focused?1:.55,line:{color:c,width:focused?8:4},marker:{color:c,size:focused?3.2:2},hovertemplate:'%{customdata[0]}<br>t=%{customdata[1]} s · speed=%{customdata[2]} m/s<extra></extra>'}}
function renderSide(values,selected){const modes=new Set(values.map(r=>r.route).filter(Boolean));if(group.value==='paper-ready-less-expanded'){const a=DATA.audit.less_expanded;metrics.innerHTML=[['Shown',values.length],['Modes',`${modes.size}/8`],['Expansion round',a.source_round],['Fixed γ',a.gamma]].map(([k,v])=>`<div class="metric"><span class="muted">${k}</span><b>${v}</b></div>`).join('');audit.innerHTML=`<b>One-round intermediate</b><p>After one expansion round, γ=0.1 widened from PRE2's 3 modes to <b>${a.selected_modes.length} displayed modes</b> (${a.selected_modes.join(', ')}), without reaching all eight.</p><span class="muted">Positive goal progress and the hard z-band are enforced; route balance precedes quality-score ranking.</span>`}else if(isCfm()){const successes=values.filter(r=>r.status==='SUCCESS').length,collisions=values.filter(r=>r.status==='COLLISION').length,a=DATA.audit.cfmmppi;metrics.innerHTML=[['Shown',values.length],['Success',`${successes}/${values.length}`],['Collision',`${collisions}/${values.length}`],['Modes',`${modes.size}/8`]].map(([k,v])=>`<div class="metric"><span class="muted">${k}</span><b>${v}</b></div>`).join('');audit.innerHTML=`<b>CFM–MPPI inference</b><p>Promoted γ=<b>${a.selected_gamma}</b>. N=${a.proposal_count} guided proposals → top ${a.elite_count} → ${a.elite_count}×${a.copies_per_elite} perturbations. NFE ${a.nfe}; CBF α=${a.cbf_alpha}, margin ${a.cbf_margin_m} m.</p><span class="muted">Regime coefficients are normalized deployment controls. Selection uses no Hₚ/verifier hard gate.</span>`}else{metrics.innerHTML=[['Shown',values.length],['Modes',`${modes.size}/8`],['Trials to 8',DATA.audit.expanded_trials_to_all_8_modes],['Selected γ',DATA.audit.selected_gamma]].map(([k,v])=>`<div class="metric"><span class="muted">${k}</span><b>${v}</b></div>`).join('');audit.innerHTML=`<b>Matched mode search</b><p>Expanded found all 8 stable modes in <b>${DATA.audit.expanded_trials_to_all_8_modes}</b> trials. PRE2 used the same trials and exposed <b>${DATA.audit.pre2_mode_count_in_matched_trials}</b> modes: ${DATA.audit.pre2_modes_in_matched_trials.join(', ')}.</p><span class="muted">Mode discovery ignores paper quality; expanded selection then applies the hard z-band, goal-jiggle gate, and smoothness ranking.</span>`}coverage.innerHTML=`<b>Route coverage</b><div class="routes">${DATA.routes.map(c=>`<div class="route ${modes.has(c)?'on':''}">${c}<br>${values.filter(r=>r.route===c).length}</div>`).join('')}</div>`;if(!selected){quality.textContent='No trajectory in this filter.';return}if(!selected.quality){quality.innerHTML=`<b>${label(selected)}</b><p><span class="badge">preserved legacy view</span>${selected.progress?.goalStrict?'<span class="badge pass">strict goal progress</span>':''}</p><span class="muted">clearance ${selected.clearance?.toFixed(3)??'—'} m · TtG ${selected.ttg?.toFixed(1)??'—'} s · validity ${selected.validity==null?'—':(100*selected.validity).toFixed(1)+'%'}</span>`;return}const q=selected.quality,status=selected.status||'SUCCESS',decision=typeof q.decision_mean_abs_z_m==='number'&&Number.isFinite(q.decision_mean_abs_z_m)?q.decision_mean_abs_z_m.toFixed(3):'—',curvature=typeof q.mean_curvature_rad_per_m==='number'&&Number.isFinite(q.mean_curvature_rad_per_m)?q.mean_curvature_rad_per_m.toFixed(3):'—';quality.innerHTML=`<b>${label(selected)}</b><p><span class="badge ${status==='SUCCESS'?'pass':'fail'}">${status}</span><span class="badge ${q.hard_z_pass?'pass':''}">z-band ${(100*q.z_band_occupancy).toFixed(1)}%</span>${status==='SUCCESS'&&q.hard_goal_progress_pass?'<span class="badge pass">no goal jiggle</span>':''}<span class="badge">reverse ${(1000*q.cumulative_goal_reverse_m).toFixed(1)} mm</span><span class="badge">|decision z−0.9| ${decision} m</span><span class="badge">curvature ${curvature} rad/m</span></p><span class="muted">exact rollout seed <b>${selected.seed??'—'}</b> · clearance ${selected.clearance?.toFixed(3)??'—'} m · TtG ${selected.ttg?.toFixed(1)??'—'} s · validity ${selected.validity==null?'—':(100*selected.validity).toFixed(1)+'%'}</span>`}
function render(){const values=rows();if(values===null){plot.style.display='none';placeholder.style.display='block';focus.innerHTML='';metrics.innerHTML='';audit.innerHTML='<b>Benchmark slot reserved</b><p class="muted">No CFM-MPPI trajectory has been inserted.</p>';coverage.innerHTML='';quality.innerHTML='';return}plot.style.display='block';placeholder.style.display='none';setFocus(values);const selected=values.find(r=>r.id===focus.value)||values[0]||null;if(selected)focus.value=selected.id;const traces=[plane(DATA.audit.hard_z_contract.band_m[0]),plane(.9,.075),plane(DATA.audit.hard_z_contract.band_m[1]),...DATA.scene.spheres.map(sphere),...values.filter(r=>r!==selected).map(r=>trace(r,false))];if(selected)traces.push(trace(selected,true));traces.push({type:'scatter3d',mode:'markers+text',x:[DATA.scene.start[0],DATA.scene.goal[0]],y:[DATA.scene.start[1],DATA.scene.goal[1]],z:[DATA.scene.start[2],DATA.scene.goal[2]],text:['START','GOAL'],textposition:'top center',showlegend:false,marker:{size:7,color:['#1f9d68','#d24b4b']}});renderSide(values,selected);Plotly.react(plot,traces,{margin:{l:0,r:0,t:0,b:0},paper_bgcolor:'rgba(0,0,0,0)',scene:{aspectmode:'data',camera:{eye:{x:1.35,y:1.5,z:.78}},xaxis:{title:'x (m)',range:DATA.scene.bounds[0]},yaxis:{title:'y (m)',range:DATA.scene.bounds[1]},zaxis:{title:'z (m)',range:DATA.scene.bounds[2]}},uirevision:'paper-ready-bowling'},{responsive:true,displaylogo:false})}
group.addEventListener('change',()=>{setGammas();setRegimes();route.value='all';render()});[gamma,regime,route,focus].forEach(x=>x.addEventListener('change',render));setGammas();setRegimes();render();
})();
</script>
</body></html>
